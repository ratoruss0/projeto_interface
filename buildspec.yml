version: 0.2
phases:
  install:
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt
      - python -m pip install flake8
  build:
    commands:
      - python -m flake8 app.py db.py relatorios.py Sistema_academico.py application.py scripts/init_mysql.py scripts/run_migrations.py migrations/env.py migrations/versions/0001_initial_schema.py migrations/versions/0002_soft_delete_core_tables.py tests/conftest.py tests/test_models.py tests/test_routes.py --select=E9,F63,F7,F82 --show-source --jobs=1
      - python -m py_compile app.py db.py relatorios.py Sistema_academico.py application.py scripts/init_mysql.py scripts/run_migrations.py migrations/env.py migrations/versions/0001_initial_schema.py migrations/versions/0002_soft_delete_core_tables.py tests/conftest.py tests/test_models.py tests/test_routes.py
      - python -m pytest
artifacts:
  files:
    - '**/*'
