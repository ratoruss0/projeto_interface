version: 0.2
phases:
  install:
    commands:
      - pip install -r requirements.txt
  build:
    commands:
      - python -m py_compile app.py
      - python -m py_compile db.py
      - python -m py_compile relatorios.py
      - python -m py_compile Sistema_academico.py
artifacts:
  files:
    - '**/*'
